name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-extension/package-lock.json
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.247
      - name: Validate plugin and fresh-copy bootstrap
        run: |
          python3 scripts/validate-plugin.py
          claude plugin validate --strict .
          scripts/smoke-install.sh --static
      - name: Check Bash and Python syntax
        run: |
          bash -n scripts/*.sh
          python3 -m compileall -q scripts
      - name: Test optional Pi extension
        working-directory: pi-extension
        run: |
          npm ci
          npm test
